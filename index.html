<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery UI: Перетаскивание, Растягивание, Вкладки</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="jqui1">
    Это блок с id = jqui1. Его можно перетаскивать и растягивать.
</div>
<div id="tabs">
    <ul>
        <li><a href="#tab-1">Вкладка 1</a></li>
        <li><a href="#tab-2">Вкладка 2</a></li>
        <li><a href="#tab-3">Вкладка 3</a></li>
    </ul>
    <div id="tab-1">
        <p>Содержимое первой вкладки.</p>
    </div>
    <div id="tab-2">
        <p>Содержимое второй вкладки.</p>
    </div>
    <div id="tab-3">
        <p>Содержимое третьей вкладки.</p>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
